# Render Blueprint — the NestJS API and its Redis.
#
# Only the API lives here. The Next.js front end is on Cloudflare Workers and Postgres is on
# Supabase, so this file describes the one piece that needs a long-running
# process: three schedulers drive the whole app (`@Interval(1000)` sweeps rooms,
# `@Interval(10_000)` resolves challenge events, metrics every five minutes) and
# none of them survive on a platform that only runs code during a request.
#
# Apply with: Render Dashboard -> Blueprints -> New Blueprint Instance.
# Values marked `sync: false` are deliberately not in git; set them in the
# dashboard on first apply.

services:
  - name: blender-battle-api
    type: web
    runtime: docker
    # Context is the repo root because the Dockerfile copies the workspace
    # manifests and packages/shared, not just apps/api.
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    # Free, which needs no card on file. Render spins a free service down after
    # 15 minutes without inbound traffic, and the schedulers stop with it.
    #
    # That is a latency problem rather than a correctness one, which was not
    # always true. Room phases are advanced on read by `RoomsService.reconcile`,
    # so the first request after a sleep brings the room up to whatever phase
    # its stored timestamps imply — a deadline is an absolute instant and does
    # not care how late it is read. The scheduler now only covers rooms nobody
    # is looking at.
    #
    # What is left is the cold start, roughly a minute. Point a free uptime
    # pinger (cron-job.org, UptimeRobot) at `/health` every 10 minutes to
    # remove it. One always-on service is roughly 730 hours a month, inside the
    # 750 the free tier allows.
    #
    # Change to `starter` when the cold start matters more than the bill.
    plan: free
    region: frankfurt
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000

      # Internal connection string from the Key Value instance below.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: blender-battle-redis
          property: connectionString

      # Postgres connection string, from whichever managed host you picked —
      # Neon and Supabase are both fine, and neither Render nor Cloudflare is:
      # Render's own free Postgres expires 30 days after creation, and
      # Cloudflare does not sell Postgres at all.
      #
      # Prefer a **pooled** endpoint where the host offers one (Supabase's
      # transaction pooler on 6543, Neon's `-pooler` host). This service keeps a
      # pool of its own, so a direct connection burns the project's slots.
      - key: DATABASE_URL
        sync: false

      # Comma-separated. The Cloudflare Workers production domain, plus any preview domain
      # that has to reach this API.
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Must equal this service's own public URL, or OAuth round trips break.
      - key: OAUTH_CALLBACK_BASE
        sync: false

      # Transactional email: password reset and address verification.
      #
      # Left at `log` the API still works — it writes the whole message,
      # including the reset link, to the application log and sends nothing. That
      # is fine for a staging box and wrong for anything real, because a user
      # who forgets their password has no way to recover.
      #
      # Set MAIL_DRIVER=resend with a key from resend.com and a MAIL_FROM on a
      # domain verified there. The API refuses to boot with `resend` and no key,
      # so a half-finished configuration fails loudly instead of dropping mail.
      - key: MAIL_DRIVER
        value: log
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

      # Generated once by Render and never shown in the repo. The two must
      # differ — a shared secret lets a leaked access token be replayed as a
      # refresh token — and generated values differ per key, so that holds.
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # Optional. Each provider switches on only when both halves are present,
      # so leaving them unset simply hides that sign-in button.
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: LOG_LEVEL
        value: info

  - name: blender-battle-redis
    type: keyvalue
    plan: free
    region: frankfurt
    # Empty allow list = reachable only from inside this Render account's
    # network. The API talks to it over the internal address, so nothing needs
    # to be exposed publicly.
    ipAllowList: []
