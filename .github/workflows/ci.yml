# Typecheck, lint and test every push and pull request.
#
# This exists because the repository had a full test toolchain — Vitest,
# supertest, @nestjs/testing, Testing Library — installed, scripted, and wired
# to nothing. There were no tests, and no job that would have noticed. A suite
# that CI does not run is a suite that stops being true within a month, so the
# tests and this file landed together.
#
# This is the only workflow in the repository, and it deploys nothing. Both
# Vercel projects watch the repository directly and redeploy on push, so CI's
# job is purely to say whether a commit is sound.
#
# Note that Vercel does not wait for this to pass. A red run and a live
# deployment of the same commit can coexist; CI tells you which one to trust.
#
# It therefore runs on everything rather than on paths: a change to the API or
# to `packages/shared` can break the web build, and a workflow scoped to
# `apps/web` would not notice.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Migrations are only ever true against a real database. A `ModelingOnly`
    # migration updated a column that an earlier migration had already dropped,
    # so every run from an empty database stopped on `column
    # "favorite_category_id" does not exist` — and because the deployment applies
    # migrations at boot, that surfaced as an API that would not start. Nothing
    # in this workflow could have seen it: the SQL is a string until something
    # executes it.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        # Without this the first migration can race the server's startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # `apps/web` and `apps/api` both resolve @bb/shared through its `dist`
      # entry, so typecheck cannot run until it has been compiled. The tests
      # resolve it to source and do not need this, but they run after.
      - name: Build shared package
        run: pnpm --filter @bb/shared build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Builds both apps. This is not redundant with typecheck: a stylesheet is
      # never type-checked and never linted, and an unbalanced brace in
      # `globals.css` failed only here — after typecheck, lint and the whole
      # test suite had all passed. The web build is also the only step that
      # exercises `generateMetadata` and the server components.
      - name: Build
        run: pnpm build

      # Guards against the failure that produced ROOM_RANKED_MIN_SUBMISSIONS:
      # a constant shared correctly, documented as enforcing an anti-collusion
      # policy, and imported by nothing. A stale value shows up in a diff; a
      # policy that is documented but unwired reads as implemented.
      - name: Check every shared export is used
        run: node scripts/check-shared-exports.mjs

      # Every migration, in order, against an empty database — which is the only
      # state that matters, since it is what a new deployment starts from. A
      # migration that is written, reviewed and committed still proves nothing
      # until something runs it.
      - name: Run migrations from an empty database
        run: pnpm --filter @bb/api migration:run
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres

      # Four deployments failed on faults nothing above could see: the function
      # died before running a line of application code, so typecheck, lint, the
      # tests and the build all passed while the deployed API returned a crash
      # page naming nothing. This bundles the serverless entry point the way the
      # platform does and requires it with no environment set — which is the
      # state a half-configured deployment is in, and the one that has to stay
      # diagnosable. Runs after Build because it needs `dist`.
      - name: Check the serverless entry point bundles and loads
        run: pnpm --filter @bb/api check:serverless

      # Vercel validates `vercel.json` against a strict schema and discards the
      # whole file on an unknown property — so a stray comment key silently
      # disables every setting in it and the deployment fails complaining about
      # whichever default then went wrong. Cheap to catch here; expensive to
      # diagnose there.
      - name: Check the Vercel config has no unknown properties
        run: node scripts/check-vercel-config.mjs
