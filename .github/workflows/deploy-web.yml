# Builds the front end for Cloudflare Workers and deploys it.
#
# The build runs here rather than on a developer machine for a concrete reason:
# OpenNext forces Next's `standalone` output, which lays out node_modules with
# symlinks, and Windows refuses to create those unless Developer Mode is on. A
# Linux runner has no such restriction, so CI is the one place the build is
# guaranteed to work for everyone on the team.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   — token with the "Edit Cloudflare Workers" template
#   CLOUDFLARE_ACCOUNT_ID  — from the Workers & Pages dashboard URL
#
# Required repository variable:
#   NEXT_PUBLIC_API_URL    — the deployed API, e.g. https://api.example.com/api/v1
#
# That last one is a variable, not a secret: `next build` inlines every
# NEXT_PUBLIC_* value into the client bundle, so it is public the moment anyone
# loads the page. Storing it as a secret would imply a confidentiality the
# browser cannot provide.

name: Deploy web (Cloudflare)

on:
  push:
    branches: [main]
    # Only paths that can change the built output. The API deploys separately.
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/deploy-web.yml'
  # Lets a deploy be re-run without an empty commit, e.g. after changing the API
  # URL variable.
  workflow_dispatch:

# One deploy at a time. Two overlapping runs would race to publish the same
# Worker and the later-started one could land first.
concurrency:
  group: deploy-web
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Type errors are cheaper to find here than in a half-deployed Worker.
      - name: Typecheck
        run: pnpm --filter @bb/shared build && pnpm --filter @bb/web typecheck

      - name: Build for Workers
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
        run: pnpm --filter @bb/web cf:build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/web
          # The build step above already produced .open-next; `deploy` alone
          # publishes it without rebuilding.
          command: deploy
